<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://ssl.gstatic.com https://www.gstatic.com; connect-src 'self' https://www.googleapis.com https://content.googleapis.com https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com https://content.googleapis.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF8F2" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="description" content="مبادرة رفع ملفات درايف مقدمة من جمعية أفياء النسائية بمنطقة عسير — Upload files straight to your own Google Drive." />
  <title>مبادرة رفع ملفات درايف</title>
  <link rel="icon" type="image/png" href="brand/favicon.png" />
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="./assets/index-Co4SQayS.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-D7RbfRiq.css">
</head>
<body>
  <noscript><p class="noscript">This app needs JavaScript. / يتطلب هذا التطبيق تفعيل JavaScript.</p></noscript>

  <!-- ============ Landing ============ -->
  <main id="landing" class="landing" hidden>
    <button class="lang-btn landing-lang" type="button" data-lang-toggle></button>
    <div class="landing-inner">
      <img class="landing-logo" src="brand/logo-full.png" width="640" height="624" alt="جمعية أفياء النسائية بمنطقة عسير" />
      <p class="initiative" lang="ar" dir="rtl">مبادرة رفع ملفات درايف مقدمة من جمعية أفياء النسائية بمنطقة عسير</p>
      <h1 class="landing-title" data-i18n="appName"></h1>
      <p class="landing-desc" data-i18n="landingDesc"></p>

      <div class="signin-block">
        <button id="btn-signin" class="gbtn" type="button">
          <svg class="gbtn-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span id="signin-label" data-i18n="signIn"></span>
        </button>
        <button id="btn-other-account" class="linkbtn" type="button" data-i18n="useOtherAccount" hidden></button>
        <p id="signin-error" class="form-error" role="alert" hidden></p>
        <p id="demo-notice" class="demo-notice" data-i18n="demoNotice" hidden></p>
      </div>

      <ul class="trust">
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-2.6 3.6-6 7.4-6 11a6 6 0 0 0 12 0c0-3.6-3.4-7.4-6-11Z"/></svg><span data-i18n="landingTrust1"></span></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><span data-i18n="landingTrust2"></span></li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span data-i18n="landingTrust3"></span></li>
      </ul>
    </div>
  </main>

  <!-- ============ App ============ -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <img src="brand/mark.png" width="28" height="42" alt="" />
        <span class="brand-name" data-i18n="appName"></span>
      </div>
      <nav class="tabs" aria-label="Sections">
        <a href="#upload" class="tab" data-tab="upload" data-i18n="navUpload"></a>
        <a href="#history" class="tab" data-tab="history" data-i18n="navHistory"></a>
      </nav>
      <div class="topbar-end">
        <button class="lang-btn" type="button" data-lang-toggle></button>
        <div class="account">
          <button id="btn-account" class="avatar-btn" type="button" aria-haspopup="true" aria-expanded="false">
            <span id="avatar" class="avatar" aria-hidden="true"></span>
            <span class="sr-only" data-i18n="accountMenu"></span>
          </button>
          <div id="account-menu" class="menu" hidden>
            <p class="menu-name" id="menu-name"></p>
            <p class="menu-email" id="menu-email"></p>
            <button type="button" class="menu-item" id="btn-signout" data-i18n="signOut"></button>
            <button type="button" class="menu-item danger" id="btn-disconnect" data-i18n="disconnect"></button>
          </div>
        </div>
      </div>
    </header>

    <!-- Upload view -->
    <main id="view-upload" class="view upload-view">
      <section class="setup" aria-labelledby="welcome">
        <div class="welcome">
          <h1 id="welcome"></h1>
          <p id="signed-in-as" class="muted"></p>
        </div>

        <div id="resume-notice" class="notice" hidden>
          <p id="resume-text"></p>
          <button type="button" class="linkbtn" id="btn-dismiss-resume" data-i18n="dismiss"></button>
        </div>

        <ol class="steps">
          <li class="step" id="step-dest">
            <span class="step-num" aria-hidden="true">1</span>
            <div class="step-body">
              <h2 data-i18n="stepDestination"></h2>
              <div id="dest-empty">
                <p class="muted" data-i18n="noFolder"></p>
              </div>
              <div id="dest-chosen" class="dest-chosen" hidden>
                <svg class="folder-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5Z"/></svg>
                <div class="dest-text">
                  <span class="muted small" data-i18n="currentFolder"></span>
                  <a id="dest-name" class="dest-name" target="_blank" rel="noopener noreferrer"></a>
                </div>
              </div>
              <p id="dest-error" class="form-error" role="alert" hidden></p>
              <div class="btn-row">
                <button type="button" class="btn btn-primary" id="btn-pick" data-i18n="selectFolder"></button>
                <button type="button" class="btn btn-quiet" id="btn-mydrive" data-i18n="useMyDrive"></button>
                <button type="button" class="btn btn-quiet" id="btn-newfolder" data-i18n="newFolder"></button>
              </div>
            </div>
          </li>

          <li class="step" id="step-files">
            <span class="step-num" aria-hidden="true">2</span>
            <div class="step-body">
              <h2 data-i18n="stepFiles"></h2>
              <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-describedby="drop-hint">
                <svg class="drop-ico" viewBox="0 0 48 60" aria-hidden="true"><path d="M24 3C24 3 5 27 5 41a19 19 0 0 0 38 0C43 27 24 3 24 3Z"/><path d="M24 48V28m-7 7 7-7 7 7"/></svg>
                <p class="drop-title" id="drop-title"></p>
                <p class="drop-hint muted small" id="drop-hint" data-i18n="dropHint"></p>
                <div class="btn-row center">
                  <button type="button" class="btn btn-quiet small" id="btn-choose-files" data-i18n="chooseFiles"></button>
                  <button type="button" class="btn btn-quiet small" id="btn-choose-folder" data-i18n="chooseFolder"></button>
                </div>
              </div>
              <input id="file-input" type="file" multiple hidden />
              <input id="folder-input" type="file" multiple webkitdirectory hidden />
              <div id="selection-bar" class="selection-bar" hidden>
                <span id="selection-summary"></span>
                <button type="button" class="linkbtn" id="btn-clear" data-i18n="clearSelection"></button>
              </div>
            </div>
          </li>

          <li class="step" id="step-options">
            <span class="step-num" aria-hidden="true">3</span>
            <div class="step-body">
              <h2 data-i18n="stepOptions"></h2>
              <label class="check">
                <input type="checkbox" id="opt-mute" />
                <span class="check-box" aria-hidden="true"></span>
                <span class="check-text">
                  <span class="check-label" data-i18n="optMute"></span>
                  <span class="check-help" data-i18n="optMuteHelp"></span>
                  <span class="check-help strong" id="mute-count" hidden></span>
                </span>
              </label>
              <label class="check">
                <input type="checkbox" id="opt-resume" checked />
                <span class="check-box" aria-hidden="true"></span>
                <span class="check-text">
                  <span class="check-label" data-i18n="optResume"></span>
                  <span class="check-help" data-i18n="optResumeHelp"></span>
                </span>
              </label>
            </div>
          </li>
        </ol>

        <div class="start-bar">
          <button type="button" class="btn btn-primary btn-start" id="btn-start" disabled></button>
        </div>
      </section>

      <section id="queue" class="queue" aria-labelledby="queue-title" hidden>
        <h2 id="queue-title" class="sr-only" data-i18n="progressTitle"></h2>

        <div id="banner" class="banner" role="status" aria-live="polite" hidden>
          <p id="banner-text"></p>
          <button type="button" class="btn btn-small btn-primary" id="banner-btn" hidden></button>
        </div>

        <div class="meter-wrap">
          <figure class="meter" aria-hidden="true">
            <div class="meter-logo">
              <img class="meter-grey" src="brand/mark.png" width="256" height="381" alt="" />
              <img class="meter-color" id="meter-color" src="brand/mark.png" width="256" height="381" alt="" />
            </div>
            <figcaption class="meter-pct"><span id="pct-num">0</span><span class="pct-sign">%</span></figcaption>
          </figure>
          <div class="meter-side">
            <p class="overall-label" data-i18n="overall"></p>
            <p id="uploading-to" class="uploading-to"></p>
            <p id="eta" class="eta muted"></p>
            <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="overall-bar"><span id="overall-fill"></span></div>
          </div>
        </div>

        <dl class="stats">
          <div><dt data-i18n="statTotal"></dt><dd id="s-total">0</dd></div>
          <div><dt data-i18n="statUploaded"></dt><dd id="s-uploaded">0</dd></div>
          <div><dt data-i18n="statUploading"></dt><dd id="s-uploading">0</dd></div>
          <div><dt data-i18n="statWaiting"></dt><dd id="s-waiting">0</dd></div>
          <div class="is-failed"><dt data-i18n="statFailed"></dt><dd id="s-failed">0</dd></div>
          <div class="wide"><dt data-i18n="statSize"></dt><dd id="s-size">0</dd></div>
        </dl>

        <div id="controls" class="controls" hidden>
          <button type="button" class="btn btn-quiet" id="btn-pause"></button>
          <button type="button" class="btn btn-quiet" id="btn-retry-failed" data-i18n="retryFailed" hidden></button>
          <button type="button" class="btn btn-danger-quiet" id="btn-cancel-all" data-i18n="cancelAll"></button>
        </div>

        <div id="done" class="done" hidden>
          <h3 data-i18n="doneTitle"></h3>
          <p id="done-body"></p>
          <p id="done-failed" class="muted" hidden></p>
          <div class="btn-row">
            <a class="btn btn-primary" id="done-open" target="_blank" rel="noopener noreferrer" data-i18n="openInDrive"></a>
            <button type="button" class="btn btn-quiet" id="btn-retry-failed-2" data-i18n="retryFailed" hidden></button>
            <button type="button" class="btn btn-quiet" id="btn-more" data-i18n="uploadMore"></button>
          </div>
        </div>

        <div class="filters" role="tablist" id="filters">
          <button type="button" role="tab" class="chip" data-filter="all"><span data-i18n="filterAll"></span> <b data-count="all"></b></button>
          <button type="button" role="tab" class="chip" data-filter="active"><span data-i18n="filterActive"></span> <b data-count="active"></b></button>
          <button type="button" role="tab" class="chip" data-filter="done"><span data-i18n="filterDone"></span> <b data-count="done"></b></button>
          <button type="button" role="tab" class="chip" data-filter="failed"><span data-i18n="filterFailed"></span> <b data-count="failed"></b></button>
        </div>
        <ul id="file-list" class="file-list"></ul>
        <p id="list-more" class="muted small center" hidden></p>
        <p id="list-empty" class="muted small center" data-i18n="emptyFilter" hidden></p>

        <details class="debug" id="debug">
          <summary data-i18n="debugToggle"></summary>
          <pre id="debug-text"></pre>
          <label class="check small" id="sim-offline-wrap" hidden>
            <input type="checkbox" id="sim-offline" />
            <span class="check-box" aria-hidden="true"></span>
            <span class="check-text"><span class="check-label" data-i18n="simulateOffline"></span></span>
          </label>
        </details>
      </section>
    </main>

    <!-- History view -->
    <main id="view-history" class="view history-view" hidden>
      <div class="history-head">
        <h1 data-i18n="historyTitle"></h1>
        <p class="muted" data-i18n="historyIntro"></p>
      </div>
      <p id="history-status" class="muted"></p>
      <ul id="history-list" class="history-list"></ul>
      <button type="button" class="linkbtn danger" id="btn-clear-history" data-i18n="clearHistory" hidden></button>
    </main>

    <footer class="footer">
      <img src="brand/mark.png" width="14" height="21" alt="" />
      <p data-i18n="footerPrivacy"></p>
    </footer>
  </div>

  <!-- ============ Dialogs ============ -->
  <dialog id="dlg-confirm" class="dialog">
    <form method="dialog">
      <p id="confirm-text" class="dialog-text"></p>
      <div class="btn-row end">
        <button value="no" class="btn btn-quiet" id="confirm-no"></button>
        <button value="yes" class="btn btn-primary" id="confirm-yes"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-newfolder" class="dialog">
    <form method="dialog" id="newfolder-form">
      <h2 data-i18n="newFolder"></h2>
      <label class="field">
        <span data-i18n="newFolderPrompt"></span>
        <input id="newfolder-name" type="text" maxlength="200" required autocomplete="off" />
      </label>
      <p id="newfolder-where" class="muted small"></p>
      <div class="btn-row end">
        <button value="cancel" class="btn btn-quiet" formnovalidate data-i18n="cancel"></button>
        <button value="ok" class="btn btn-primary" data-i18n="create"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-dup" class="dialog dialog-wide">
    <form method="dialog">
      <h2 data-i18n="dupTitle"></h2>
      <p id="dup-intro" class="dialog-text"></p>
      <div class="dup-all">
        <span class="muted small" data-i18n="dupApplyAll"></span>
        <button type="button" class="chip" data-dup-all="new" data-i18n="dupNew"></button>
        <button type="button" class="chip" data-dup-all="replace" data-i18n="dupReplace"></button>
        <button type="button" class="chip" data-dup-all="skip" data-i18n="dupSkip"></button>
      </div>
      <ul id="dup-list" class="dup-list"></ul>
      <p class="muted small" data-i18n="dupReplaceNote"></p>
      <div class="btn-row end">
        <button value="cancel" class="btn btn-quiet" data-i18n="cancel"></button>
        <button value="ok" class="btn btn-primary" data-i18n="continue"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-big" class="dialog">
    <form method="dialog">
      <h2 data-i18n="bigTitle"></h2>
      <p id="big-body" class="dialog-text"></p>
      <ul id="big-list" class="plain-list small"></ul>
      <div class="btn-row end">
        <button value="cancel" class="btn btn-quiet" data-i18n="cancel"></button>
        <button value="skip" class="btn btn-quiet" data-i18n="bigSkip"></button>
        <button value="sound" class="btn btn-primary" data-i18n="bigUploadSound"></button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-folders" class="dialog dialog-wide">
    <form method="dialog">
      <h2 data-i18n="pickerTitle"></h2>
      <p id="folders-path" class="muted small"></p>
      <ul id="folders-list" class="folders-list"></ul>
      <div class="btn-row end">
        <button value="cancel" class="btn btn-quiet" data-i18n="cancel"></button>
        <button value="ok" class="btn btn-primary" id="folders-ok"></button>
      </div>
    </form>
  </dialog>

</body>
</html>
